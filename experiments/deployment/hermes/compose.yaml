name: fiware-mcp-hermes-farm
services:
  mongo:
    image: mongo:4.4.29
    platform: linux/amd64
    command: ["--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - hermes-mongo-data:/data/db

  farm-context:
    image: python:3.12.8-slim
    command: ["python", "/farm/serve_context.py", "--bind", "0.0.0.0", "--port", "3004"]
    volumes:
      - ../../../tests/farm:/farm:ro
    ports:
      - "127.0.0.1:13004:3004"

  orion:
    image: fiware/orion-ld:1.12.0
    platform: linux/amd64
    command: ["-dbhost", "mongo", "-mongocOnly", "-logLevel", "WARN"]
    depends_on:
      mongo:
        condition: service_healthy
      farm-context:
        condition: service_started
    ports:
      - "127.0.0.1:1136:1026"

volumes:
  hermes-mongo-data:
